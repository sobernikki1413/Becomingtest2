:root{--o:#123b4b;--sea:#316e79;--mist:#e7f0ef;--rose:#f1dbe4;--ink:#25434a}*{box-sizing:border-box}body{margin:0;background:#e6eeee;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}.app{max-width:940px;min-height:100vh;margin:auto;background:#fffdfb;box-shadow:0 8px 50px #123b4b24;display:grid;grid-template-columns:200px 1fr}aside{background:var(--o);color:white;padding:25px 14px}aside h1{font-size:25px;margin:0 0 5px}aside p{color:#c7e1e3;font-size:13px;margin-bottom:28px}nav{display:grid;gap:5px}nav button{background:none;border:0;text-align:left;color:#e1eff0;padding:13px;border-radius:10px;font:inherit;cursor:pointer}nav button.active{background:#ffffff2e}main{padding:30px;min-width:0}h2{font-size:27px;margin:0 0 20px}h3{margin:0 0 10px}p{line-height:1.55}.hero{background:linear-gradient(125deg,#123b4b,#397983);color:white;border-radius:22px;padding:26px;margin-bottom:17px}.hero h3{font-size:25px}.hero p{color:#dbeaed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.card{border:1px solid #d7e4e5;border-radius:17px;background:white;padding:19px;margin-bottom:12px}.card p{color:#5a7479;font-size:14px}.btn{background:var(--sea);border:0;border-radius:11px;color:white;padding:11px 15px;cursor:pointer;font:inherit;font-weight:600}.btn.soft{background:var(--rose);color:#603e4c}.btn.alt{background:var(--mist);color:var(--o)}label{display:block;font-weight:600;font-size:14px;margin:15px 0 6px}textarea,input,select{width:100%;border:1px solid #b9d1d3;border-radius:10px;padding:11px;font:inherit;background:white}textarea{min-height:85px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #c7d9da;background:white;border-radius:30px;padding:8px 11px;cursor:pointer}.chip.on{background:#c8e1e3;border-color:#498b94}.entry{border:1px solid #d5e2e3;padding:13px;border-radius:12px;margin:9px 0;background:#fff}.entry small{color:#658086}.entry p{white-space:pre-wrap;overflow-wrap:anywhere}.stats{display:flex;gap:10px}.stats div{background:#f8eaf0;padding:15px;border-radius:13px;flex:1;text-align:center}.stats strong{display:block;font-size:25px}.notice{background:#fbf3e5;border:1px solid #e9d9bb;border-radius:12px;padding:13px;font-size:13px;margin:18px 0}.foot{font-size:12px;color:#627c81;margin:25px 0 65px}.bottom{display:none}.circle{height:145px;width:145px;border-radius:50%;background:radial-gradient(circle,#f3dbe5,#89b8bf);display:grid;place-items:center;text-align:center;margin:25px auto;transition:transform 1s;font-weight:700}.circle.in{transform:scale(1.13)}.circle.out{transform:scale(.89)}.hide{display:none}@media(max-width:650px){.app{display:block}aside{display:none}main{padding:22px 16px}.grid{grid-template-columns:1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fffdfbf5;border-top:1px solid #c8dbdc;padding:9px 2px max(9px,env(safe-area-inset-bottom));z-index:10}.bottom button{border:0;background:transparent;color:#426d74;font-size:11px;padding:8px 0}.bottom button.active{font-weight:800;color:#143b4a}.stats div{padding:9px}.stats strong{font-size:20px}}

:root{--o:#102a40;--sea:#176b77;--mist:#e5f1f0;--rose:#f4c6d1;--ink:#233b4a}body{background:linear-gradient(145deg,#102a40,#1b6475 50%,#d59baf);background-attachment:fixed}.app{background:#fffbfa}aside{background:linear-gradient(165deg,#102a40,#17546c 68%,#71465f)}.hero{background:linear-gradient(125deg,#102a40 0%,#165f70 55%,#925b7c 100%);box-shadow:0 8px 22px #102a4025}.hero h3{letter-spacing:-.025em}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:#f5c7d0;margin-bottom:12px}.btn{background:#176b77}.btn.soft{background:#f4c6d1;color:#513448}.card{border-color:#d6e3e3;box-shadow:0 2px 12px #143f4b0b}.feature{border-left:4px solid #bb7891}.gentle{color:#66566a;font-style:italic;text-align:center;margin:22px 0}.token-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}.token{border:1px solid #e5c3cb;background:linear-gradient(145deg,#fff5f4,#e4f0f0);padding:15px;border-radius:16px;text-align:center;display:grid;gap:5px}.token small{color:#647b83}.medal{margin:auto;border:3px double #b97981;background:linear-gradient(135deg,#f6d4bd,#bd7c8f);border-radius:50%;height:66px;width:66px;display:grid;place-items:center;color:#fff;font-size:28px}.simple-view .hero{background:#123b4b;box-shadow:none}.simple-view .card{box-shadow:none}.simple-view .circle{transition:none}details{margin-top:15px;border-top:1px solid #d8e4e5;padding-top:15px}summary{cursor:pointer;font-weight:600;color:#176b77}.chip:focus-visible,.btn:focus-visible,nav button:focus-visible{outline:3px solid #c780a0;outline-offset:2px}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style></head><body><div class="app"><aside><h1>🌊 Becoming</h1><p>A gentle place to begin again.</p><nav id="side"></nav></aside><main><h2 id="title">Welcome to Becoming</h2><div id="screen"></div><p class="foot">PREVIEW ONLY • Browser-based prototype, not a finished or clinically validated app. Avoid sensitive information. Entries are stored in this browser on this device unless you export them. Browser data can be cleared.</p></main></div><nav class="bottom" id="bottom"></nav><script>
const encouragement=['You deserve peace, even on difficult days.','You can pause without giving up.','Your progress is bigger than one moment.','You are worthy of kindness, including your own.'];let encouragementIndex=new Date().getDate()%encouragement.length;let journalMode='blank',urgeNeed='',urgeStage=0;const settings=()=>{try{return JSON.parse(localStorage.getItem('becoming_preferences')||'{}')}catch{return {}}};function setPref(k,v){localStorage.setItem('becoming_preferences',JSON.stringify({...settings(),[k]:v}));render()}const tabs=[['home','⌂ Home'],['mental','♡ Mental Health'],['reflect','✎ Reflect'],['growth','✿ My Growth'],['more','☼ More']];let page='home',mood='',strategies=[],timer=null;const store=k=>{try{return JSON.parse(localStorage.getItem('sl_'+k)||'[]')}catch{return []}},put=(k,a)=>localStorage.setItem('sl_'+k,JSON.stringify(a));const el=id=>document.getElementById(id),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const now=()=>new Date().toLocaleString();const b=(text,fn,cls='')=>`<button class="btn ${cls}" onclick="${fn}">${text}</button>`;
function nav(p){if(timer){clearInterval(timer);timer=null}page=p;render()}function menu(){for(const id of ['side','bottom'])el(id).innerHTML=tabs.map(([k,n])=>`<button class="${page===k?'active':''}" onclick="nav('${k}')">${n}</button>`).join('')}
function rows(kind){let a=store(kind);return a.length?a.map((x,i)=>`<div class="entry"><small>${escapeHtml(x.date)}</small><p>${escapeHtml(x.text||'')}${x.mood?'Mood: '+escapeHtml(x.mood)+'\n':''}${x.trigger?'Trigger: '+escapeHtml(x.trigger)+'\n':''}${x.spend?'Spending note: '+escapeHtml(x.spend)+'\n':''}${x.strategies?.length?'Coping: '+escapeHtml(x.strategies.join(', '))+'\n':''}${x.helped?'What helped: '+escapeHtml(x.helped)+'\n':''}${x.need?'Next support: '+escapeHtml(x.need):''}${x.answers?x.answers.map(v=>'\n'+escapeHtml(v.q)+'\n'+escapeHtml(v.a)).join('\n'):''}</p>${b('Delete',`del('${kind}',${i})`,'alt')}</div>`).join(''):'<div class="entry">Nothing saved here yet. No pressure to start.</div>'}
function del(k,i){if(!confirm('Delete this entry permanently?'))return;let a=store(k);a.splice(i,1);put(k,a);render()}
function render(){menu();el('title').textContent=({home:'Welcome to Becoming',mental:'Support for this moment',reflect:'Your reflections',growth:'Your growth matters',more:'More & Settings',checkin:'Daily check-in'})[page];let s='';if(page==='home'){s=`<div class="hero"><div class="eyebrow">A place to begin again</div><h3>Welcome to Becoming</h3><p>Your journey matters, exactly where you are today.</p>${b('♡ Help Me Right Now',"nav('mental');tool('urge')",'soft')}</div><div class="card feature"><h3>Today's gentle reflection</h3><p>Did you experience an urge to spend impulsively today? How were you feeling emotionally?</p>${b('Reflect for a moment',"nav('checkin')")}</div><h3>What do you need today?</h3><div class="grid"><div class="card"><h3>♡ Spending urge support</h3><p>Find a little breathing room before a purchase.</p>${b('Help with an urge',"nav('mental');tool('urge')")}</div><div class="card"><h3>✎ Reflect</h3><p>Write freely or choose a gentle prompt.</p>${b('Open Reflect',"nav('reflect')")}</div><div class="card"><h3>〰 Emotional wellness</h3><p>Breathing, grounding, and support for hard moments.</p>${b('Find support',"nav('mental')")}</div><div class="card"><h3>✿ My Growth</h3><p>Your milestones and victories belong to you.</p>${b('See my growth',"nav('growth')")}</div></div><p class="gentle">A setback never erases the progress you've made.</p>`}
if(page==='checkin'){s=`<div class="hero"><h3>Just a moment for you</h3><p>These two questions are here each day. Answer only what feels helpful.</p></div><div class="card"><h3>Did you experience an urge to spend impulsively today?</h3><div class="chips"><button class="chip" onclick="showTrigger(true,this)">Yes</button><button class="chip" onclick="showTrigger(false,this)">No</button><button class="chip" onclick="showTrigger(false,this)">Not sure</button></div><div id="triggerWrap" class="hide"><label>What might have triggered it? (optional)</label><select id="triggerChoice"><option value="">Choose if you like</option><option>Stress</option><option>Boredom</option><option>Loneliness</option><option>Sadness</option><option>Excitement</option><option>Not sure</option><option>Something else</option></select></div><label>How were you feeling emotionally today?</label><div class="chips" id="moods">${['Calm','Hopeful','Anxious','Sad','Overwhelmed','Restless','Proud'].map(x=>`<button class="chip ${mood===x?'on':''}" onclick="chooseMood('${x}',this)">${x}</button>`).join('')}</div><details><summary>Want to reflect a little more?</summary><label>What helped you manage an urge?</label><textarea id="helped" placeholder="Anything that helped, even a little"></textarea><label>What support might help next time?</label><textarea id="need"></textarea><label>Anything else on your mind?</label><textarea id="spend"></textarea></details><p>${b('Save my reflection','saveCheckin()')} ${b('Maybe later',"nav('home')",'alt')}</p></div><h3>Past check-ins</h3>${rows('checkins')}`}
if(page==='reflect'){s=`<div class="hero"><h3>What's on your heart today?</h3><p>A quiet space to write as much or as little as you like.</p></div><div class="card"><div class="chips"><button class="chip ${journalMode==='blank'?'on':''}" onclick="journalMode='blank';render()">Blank page</button><button class="chip ${journalMode==='guided'?'on':''}" onclick="journalMode='guided';render()">Gentle prompt</button></div>${journalMode==='guided'?`<label for="journal">What has been on your mind lately?</label>`:`<label for="journal">Your space</label>`}<textarea id="journal" placeholder="Start anywhere..."></textarea><p>${b('Save reflection','saveJournal()')}</p></div><div class="card"><h3>Gratitudes</h3><p>What are you grateful for today?</p><textarea id="gratitude" placeholder="Something small counts, too..."></textarea><p>${b('Save gratitude','saveGratitude()')}</p></div><h3>Reflection history</h3>${rows('reflections')}<h3>Gratitude history</h3>${rows('gratitudes')}`}

if(page==='mental'){s=`<div class="hero"><div class="eyebrow">A little light for today</div><h3>${escapeHtml(encouragement[encouragementIndex])}</h3><p>${b('Another encouragement','nextEncouragement()','soft')}</p></div><h3>Spending Recovery</h3><div class="grid"><div class="card"><h3>♡ I'm having a spending urge</h3><p>Start with a quick, gentle pause.</p>${b('Help me now',"tool('urge')")}</div><div class="card"><h3>☼ My coping plan</h3><p>Keep what helps close by.</p>${b('Open my plan',"tool('plan')")}</div></div><h3>Emotional Wellness</h3><div class="grid"><div class="card"><h3>〰 Breathing</h3><p>A comfortable rhythm with a countdown.</p>${b('Start breathing',"tool('breathe')")}</div><div class="card"><h3>⌁ Grounding</h3><p>Reconnect with the present moment.</p>${b('Try grounding',"tool('ground')")}</div></div><div id="tool"></div><div class="notice">If you are in immediate danger, call emergency services. In the U.S., call or text 988 for mental health crisis support. This preview is not monitored or a substitute for care.</div>`}
if(page==='growth'){s=`<div class="hero"><h3>Every step belongs to your story.</h3><p>Celebrate what matters to you, at your own pace.</p>${b('＋ Add a victory','addWin()','soft')}</div><div class="card"><h3>My recovery journeys</h3><p>Track different journeys independently. Dates can be corrected anytime; milestones are never erased.</p><div id="journeys">${journeyList()}</div>${b('＋ Add a recovery journey','addJourney()')}</div><div class="card"><h3>My Token Collection</h3><p>Anniversary and personal milestones, all in one place.</p>${tokenList()}${b('＋ Personal milestone','addPersonalToken()','soft')}</div><div class="card"><h3>Personal goals</h3>${b('＋ Add goal','addGoal()')}<div style="margin-top:12px">${store('goals').map((g,i)=>`<div class="entry"><label style="margin:0"><input type="checkbox" style="width:auto" ${g.done?'checked':''} onchange="goalDone(${i},this.checked)"> ${escapeHtml(g.text)}</label>${b('Delete',`del('goals',${i})`,'alt')}</div>`).join('')||'<p>No goals yet. You choose the pace.</p>'}</div></div><h3>Victories & accomplishments</h3>${rows('wins')}`}
if(page==='more'){s=`<div class="hero"><h3>Explore at your own pace</h3><p>Everything you need, without the clutter.</p></div><div class="card"><h3>Learn & Explore</h3><p>Spending recovery is at the heart of Becoming.</p>${b('Spending Recovery Library',"openLibrary('spending')")} ${b('Faith & Spirituality',"openLibrary('spiritual')",'soft')}<div id="library"></div></div><div class="card"><h3>My Favorites</h3><p>Resources you have saved for later.</p><div id="favorites">${favoriteList()}</div></div><div class="card"><h3>Personalize Becoming</h3><label><input type="checkbox" style="width:auto" ${settings().simple?'checked':''} onchange="setPref('simple',this.checked)"> Simple View</label><p>Fewer visual effects and a quieter layout.</p></div><div class="card"><h3>Backup and restore</h3><p>Export a JSON file of your browser entries. Backups are not encrypted; keep them private. Restore asks before replacing records.</p>${b('Export preview backup','exportBackup()')}<label>Restore a preview backup</label><input type="file" accept=".json,application/json" onchange="importBackup(this)"></div><div class="card"><h3>Delete preview data</h3>${b('Clear all preview entries','clearAll()','alt')}</div><div class="notice">This is a browser prototype, not a secure production app. Do not enter sensitive financial or health details. There is no app lock, encryption, cloud backup, or live community yet.</div>`}
el('screen').innerHTML=s;document.body.classList.toggle('simple-view',!!settings().simple)}
function toggle(x){strategies=strategies.includes(x)?strategies.filter(y=>y!==x):[...strategies,x];document.querySelectorAll('#strategies .chip').forEach(b=>b.classList.toggle('on',strategies.includes(b.textContent)))}
function chooseMood(x,button){mood=x;document.querySelectorAll('#moods .chip').forEach(y=>y.classList.toggle('on',y===button))}
let selectedUrge='';function showTrigger(yes,button){selectedUrge=button.textContent;document.querySelectorAll('.card .chips:first-of-type .chip').forEach(y=>y.classList.toggle('on',y===button));el('triggerWrap').classList.toggle('hide',!yes)}
function saveCheckin(){let a=store('checkins');a.unshift({date:now(),mood,trigger:el('triggerChoice')?.value||'',spend:el('spend')?.value||'',helped:el('helped')?.value||'',need:el('need')?.value||'',text:'Spending urge: '+(selectedUrge||'Not answered')+'\n'});put('checkins',a);mood='';selectedUrge='';render()}
function saveJournal(){let x=el('journal').value.trim();if(!x)return;let a=store('reflections');a.unshift({date:now(),text:x});put('reflections',a);render()}
function saveGratitude(){let x=el('gratitude').value.trim();if(!x)return;let a=store('gratitudes');a.unshift({date:now(),text:x});put('gratitudes',a);render()}
function nextEncouragement(){encouragementIndex=(encouragementIndex+1)%encouragement.length;render()}
function addGoal(){let x=prompt('What small goal would you like to set?');if(!x?.trim())return;let a=store('goals');a.push({date:now(),text:x.trim(),done:false});put('goals',a);render()}
function goalDone(i,v){let a=store('goals');a[i].done=v;put('goals',a);render()}
function addWin(){let x=prompt('What small win would you like to recognize?');if(!x?.trim())return;let a=store('wins');a.unshift({date:now(),text:x.trim()});put('wins',a);render()}
function tool(t){if(timer){clearInterval(timer);timer=null}let h='';if(t==='breathe'){h=`<div class="card"><h3>Gentle breathing</h3><p>Follow a comfortable rhythm. If counting feels uncomfortable, breathe naturally instead.</p><div class="circle" id="circle">Ready</div><p id="breathLabel" style="text-align:center">Tap start when ready.</p>${b('Start','startBreath()')} ${b('Stop','stopBreath()','alt')}</div>`}if(t==='ground'){h=`<div class="card"><h3>Grounding with your senses</h3><ol><li>Notice 5 things you can see.</li><li>Notice 4 things you can feel.</li><li>Listen for 3 things you can hear.</li><li>Notice 2 things you can smell, or two comfortable sensations.</li><li>Say 1 kind thing to yourself.</li></ol><p>You can skip any step. You're allowed to go slowly.</p></div>`}if(t==='urge'){urgeStage=0;h=`<div class="card"><h3>A pause for this moment</h3><p>Take a gentle breath. You don't have to decide anything right now.</p><div class="circle" id="circle">Breathe</div><p id="breathLabel" style="text-align:center">A comfortable breath is enough.</p>${b('Start breathing','startBreath()')} ${b('Continue',"urgeStep(1)",'soft')}<p>${b("I'm okay for now", "stopBreath();el('tool').innerHTML=''",'alt')}</p></div>`}if(t==='plan'){h=`<div class="card"><h3>My personal coping plan</h3><label>What tends to trigger me?</label><textarea id="pTrigger"></textarea><label>What helps me?</label><textarea id="pHelp"></textarea><label>One first step</label><textarea id="pStep"></textarea><p>${b('Save coping plan','savePlan()')}</p><h3>Saved plans</h3>${rows('plans')}</div>`}el('tool').innerHTML=h;el('tool').scrollIntoView({behavior:'smooth',block:'start'})}
function startBreath(){stopBreath();let count=4,inhale=true;function tick(){if(!el('circle')){stopBreath();return}el('circle').className='circle '+(inhale?'in':'out');el('circle').textContent=(inhale?'Breathe in':'Breathe out')+'\n'+count;el('breathLabel').textContent=inhale?'Inhale gently':'Exhale comfortably';count--;if(count===0){inhale=!inhale;count=inhale?4:6}}tick();timer=setInterval(tick,1000)}function stopBreath(){if(timer)clearInterval(timer);timer=null;if(el('circle')){el('circle').className='circle';el('circle').textContent='Paused';el('breathLabel').textContent='Rest as long as you need.'}}
function saveUrge(){let x=el('urgeNote').value.trim();if(!x)return alert('Add a next step if you would like to save it.');let a=store('wins');a.unshift({date:now(),text:'Spending-urge pause: '+x});put('wins',a);alert('Saved in My Growth.')}
function savePlan(){let x={date:now(),text:'Trigger: '+el('pTrigger').value+'\nWhat helps: '+el('pHelp').value+'\nFirst step: '+el('pStep').value};let a=store('plans');a.unshift(x);put('plans',a);tool('plan')}
function urgeStep(step){stopBreath();let h=step===1?`<div class="card"><h3>What are you needing right now?</h3><p>There's no wrong answer.</p><div class="chips">${['Comfort','Connection','Distraction','Excitement','Not sure'].map(x=>`<button class="chip" onclick="urgeNeed='${x}';urgeStep(2)">${x}</button>`).join('')}</div><p>${b('Skip',"urgeStep(2)",'alt')} ${b("I'm okay for now","el('tool').innerHTML=''",'alt')}</p></div>`:`<div class="card"><h3>One small next step</h3><p>${escapeHtml(({Comfort:'Try a warm drink or a calming breath.',Connection:'Consider messaging someone you trust.',Distraction:'Try a short walk or a favorite song.',Excitement:'Try a creative activity that feels energizing.'})[urgeNeed]||'You can wait before deciding, or choose another kind step.')}</p><p>${b('Explore more support',"tool('plan')")} ${b("I'm okay for now","el('tool').innerHTML=''",'alt')}</p></div>`;el('tool').innerHTML=h}
function addJourney(){let name=prompt('Name your recovery journey (for example, Spending Recovery)');if(!name?.trim())return;let date=prompt('Recovery start date (YYYY-MM-DD)',new Date().toISOString().slice(0,10));if(!/^\d{4}-\d{2}-\d{2}$/.test(date||'')||!Number.isFinite(new Date(date+'T12:00:00').getTime()))return alert('Please enter a valid date.');let a=store('journeys');a.push({name:name.trim(),date});put('journeys',a);render()}
function editJourney(i){let a=store('journeys');let date=prompt('Update recovery date (YYYY-MM-DD)',a[i].date);if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(new Date(date+'T12:00:00').getTime()))return;a[i].date=date;put('journeys',a);render()}
function journeyList(){let a=store('journeys');return a.length?a.map((j,i)=>{let days=Math.max(0,Math.floor((Date.now()-new Date(j.date+'T12:00:00').getTime())/86400000));return `<div class="entry"><strong>${escapeHtml(j.name)}</strong><p>${days} days since ${escapeHtml(j.date)}</p>${b('Correct date',`editJourney(${i})`,'alt')}</div>`}).join(''):'<p>No recovery dates added yet. Your journey is yours to define.</p>'}
function addPersonalToken(){let name=prompt('What personal milestone are you celebrating?');if(!name?.trim())return;let a=store('personalTokens');a.unshift({name:name.trim(),date:new Date().toISOString().slice(0,10)});put('personalTokens',a);render()}
function tokenList(){let tokens=store('personalTokens').map(x=>({name:x.name,date:x.date}));for(const j of store('journeys')){let start=new Date(j.date+'T12:00:00');for(const [days,label] of [[7,'One week'],[30,'One month'],[90,'Three months'],[180,'Six months'],[365,'One year'],[730,'Two years'],[1095,'Three years']]){let when=new Date(start.getTime()+days*86400000);if(when<=new Date())tokens.push({name:j.name+' · '+label,date:when.toISOString().slice(0,10)})}}return tokens.length?`<div class="token-grid">${tokens.map(x=>`<div class="token"><div class="medal">✦</div><strong>${escapeHtml(x.name)}</strong><small>${escapeHtml(x.date)}</small></div>`).join('')}</div>`:'<p>Your milestones will appear here when you add a recovery date or personal victory.</p>'}
const resources={spending:[['Understanding spending urges','An urge is a feeling, not an instruction. Notice what happened just before it arose.'],['Emotional triggers','Stress, boredom, loneliness, and excitement can all shape shopping habits.'],['The purchase pause','Give yourself a little time before deciding. A pause is a choice, not a punishment.'],['Recovery without shame','A difficult purchase does not erase the insight and progress you have made.']],spiritual:[['Different paths to meaning','Faith, spirituality, and secular reflection can each offer meaning and community.'],['Mindfulness and grounding','Notice your breath and surroundings without needing to change what you feel.'],['Personal reflection','What helps you feel connected, peaceful, or purposeful?']]};
function openLibrary(type){el('library').innerHTML=resources[type].map(([title,desc],i)=>`<div class="entry"><strong>${escapeHtml(title)}</strong><p>${escapeHtml(desc)}</p>${b('Save favorite',`addFavorite('${type}',${i})`,'alt')}</div>`).join('')}
function addFavorite(type,i){let a=store('favorites'),title=resources[type][i][0];if(!a.some(x=>x.title===title))a.unshift({title,description:resources[type][i][1]});put('favorites',a);el('favorites').innerHTML=favoriteList()}
function favoriteList(){return store('favorites').map((x,i)=>`<div class="entry"><strong>${escapeHtml(x.title)}</strong><p>${escapeHtml(x.description)}</p>${b('Remove',`removeFavorite(${i})`,'alt')}</div>`).join('')||'<p>No favorites yet.</p>'}
function removeFavorite(i){let a=store('favorites');a.splice(i,1);put('favorites',a);render()}
const keys=['checkins','reflections','goals','wins','plans','gratitudes','journeys','personalTokens','favorites'];function exportBackup(){let obj={type:'soft-landing-preview',version:2,date:new Date().toISOString(),data:Object.fromEntries(keys.map(k=>[k,store(k)]))};let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='becoming-preview-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let d;try{d=JSON.parse(r.result);if(d.type!=='soft-landing-preview'||![1,2].includes(d.version)||!d.data||!['checkins','reflections','goals','wins','plans'].every(k=>Array.isArray(d.data[k])))throw Error('Unsupported backup');}catch(e){alert('This is not a valid Becoming preview backup. Nothing was changed.');return}let counts=keys.map(k=>`${k}: ${d.data[k].length}`).join('\n');if(!confirm('This backup contains:\n'+counts+'\n\nRestore will REPLACE the current preview entries in this browser. Continue?'))return;keys.forEach(k=>put(k,Array.isArray(d.data[k])?d.data[k]:[]));alert('Preview backup restored.');render()};r.readAsText(f)}
function clearAll(){if(!confirm('Delete ALL saved preview entries in this browser? This cannot be undone.'))return;if(!confirm('Last confirmation: clear all Becoming preview entries?'))return;keys.forEach(k=>localStorage.removeItem('sl_'+k));render()}
render();
</script></body></html>
